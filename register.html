{% extends 'base.html' %}{% block content %}<section class="auth card"><div class="auth-icon">👨‍🌾</div><h1>{{t('register')}}</h1><form method="post"><label>{{t('name')}}<input name="name" maxlength="80" required></label><label>{{t('phone')}}<input name="phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></label><label>{{t('village')}}<input name="village" maxlength="100" required></label><label>{{t('password')}}<input type="password" name="password" minlength="6" required></label><button class="btn full">{{t('create_account')}} →</button></form><p class="center"><a href="{{url_for('login',role='farmer')}}">{{t('login')}}</a></p></section>{% endblock %}
